<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zorgstart Marketplace</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-row">
      <div class="brand">
        <div class="brand-title">🏠 Zorgstart</div>
        <div class="brand-subtitle">Marketplace</div>
      </div>

      <div class="header-actions">
        <span class="pill">🇧🇪 Nederlands</span>
        <button class="btn btn-host" type="button">Account zorgverlener</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <h1>Vind je zorg- of dienstverlener</h1>

      <div class="search-bar" role="search" aria-label="Zoeken">
        <input id="q-location" type="text" placeholder="📍 Postcode of gemeente" aria-label="Postcode of gemeente" />
        <input id="q-language" type="text" placeholder="🌍 Taal / cultuur" aria-label="Taal / cultuur" />
        <button id="btn-search" class="btn btn-search" type="button">Zoeken</button>
      </div>

      <p class="hero-hint">Zoek op regio, taal en type ondersteuning. Resultaten tonen geverifieerde aanbieders.</p>
    </div>
  </section>

  <main class="container layout">
    <aside class="filters" aria-label="Filters">
      <h2>Filters</h2>

      <div class="filter-group">
        <h3>Type</h3>

        <label class="check">
          <input id="f-tv" type="checkbox" value="thuisverpleging" />
          <span>Thuisverpleging</span>
        </label>

        <div id="tv-subfilters" class="subfilters" aria-label="Thuisverpleging expertise" aria-disabled="true">
          <label class="check"><input class="f-tv-exp" type="checkbox" value="algemene zorg" /> <span>Algemene zorg & medicatie</span></label>
          <label class="check"><input class="f-tv-exp" type="checkbox" value="wondzorg" /> <span>Expert wondzorg</span></label>
          <label class="check"><input class="f-tv-exp" type="checkbox" value="palliatief" /> <span>Palliatieve thuiszorg</span></label>
          <label class="check"><input class="f-tv-exp" type="checkbox" value="opat" /> <span>Expert OPAT</span></label>
          <label class="check"><input class="f-tv-exp" type="checkbox" value="diabetes" /> <span>Diabeteseducator</span></label>
          <label class="check"><input class="f-tv-exp" type="checkbox" value="oncologie" /> <span>Expert oncologie</span></label>
          <label class="check"><input class="f-tv-exp" type="checkbox" value="tpn/picc" /> <span>TPN / PICC</span></label>
        </div>

        <label class="check"><input id="f-kine" type="checkbox" value="kinesitherapie" /> <span>Kinesitherapie</span></label>
        <label class="check"><input id="f-gezin" type="checkbox" value="gezinshulp" /> <span>Gezinshulp</span></label>
        <label class="check"><input id="f-maaltijd" type="checkbox" value="warme maaltijden" /> <span>Warme maaltijden</span></label>
        <label class="check"><input id="f-hulpmiddelen" type="checkbox" value="hulpmiddelen" /> <span>Hulpmiddelen</span></label>
        <label class="check"><input id="f-klus" type="checkbox" value="klusjesdienst" /> <span>Klusjesdienst</span></label>
      </div>

      <div class="filter-group">
        <h3>Beschikbaarheid</h3>
        <label class="check"><input id="f-available" type="checkbox" /> <span>Alleen beschikbaar</span></label>
        <label class="check"><input id="f-verified" type="checkbox" /> <span>Alleen geverifieerd</span></label>
      </div>

      <button id="btn-reset" class="btn btn-reset" type="button">Reset filters</button>
    </aside>

    <section class="results">
      <div class="results-top">
        <h2 class="results-title">Aanbieders</h2>
        <div id="results-count" class="results-count">—</div>
      </div>

      <section id="provider-list" class="listings" aria-label="Resultaten">
        <!-- kaarten komen hier via JS -->
      </section>

      <div id="empty-state" class="empty" hidden>
        <h3>Geen resultaten</h3>
        <p>Probeer een andere postcode, taal of filter.</p>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
